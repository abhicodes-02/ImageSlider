<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="slider">
        <div class="slides">
            <!-- Images will be dynamically loaded by JS -->
            <img id="slider-image" src="images/1.jpg" alt="Slider Image" />
            <h1 id="slider-caption">This is Picture No. 1</h1>
        </div>
        <button class="nav prev" onclick="prevSlide()">❮</button>
        <button class="nav next" onclick="nextSlide()">❯</button>
    </div>
</body>

</html>
